server:
  port: 8080

spring:
  application:
    name: pulseops-backend

  # SQL Database (H2 by default for zero-friction local run; switch to postgres via profile)
  datasource:
    url: jdbc:h2:mem:pulseops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # NoSQL Database (MongoDB)
  data:
    mongodb:
      uri: mongodb://localhost:27017/pulseops
      auto-index-creation: true

app:
  jwt:
    secret: PulseOpsUltraSecureJwtSigningKeyEnterpriseGrade2026WithAtLeast256BitsLength
    expiration-ms: 86400000

logging:
  level:
    com.pulseops: INFO
    org.springframework.security: WARN
    org.mongodb.driver: WARN
